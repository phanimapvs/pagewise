<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Pagewise — your reading, page by page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2118"/>
      <stop offset="0.55" stop-color="#4a3826"/>
      <stop offset="1" stop-color="#7a5a3a"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e9"/>
      <stop offset="1" stop-color="#f0e2c8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9b872"/>
      <stop offset="1" stop-color="#d99a4e"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D344A"/>
      <stop offset="1" stop-color="#0E1D2B"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- subtle page lines in the background -->
  <g opacity="0.06" stroke="#fdf6e9" stroke-width="2">
    <line x1="60" y1="70" x2="1220" y2="70"/>
    <line x1="60" y1="120" x2="1220" y2="120"/>
    <line x1="60" y1="170" x2="1220" y2="170"/>
    <line x1="60" y1="220" x2="1220" y2="220"/>
    <line x1="60" y1="270" x2="1220" y2="270"/>
  </g>

  <!-- Night Shelf app icon -->
  <g filter="url(#soft)" transform="translate(110,90)">
    <rect width="180" height="180" rx="42" fill="url(#iconbg)"/>
    <rect width="180" height="180" rx="42" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
    <g transform="translate(-84.6,-84.6) scale(0.332)">
      <!-- Ember spine -->
      <path fill="#F0A15B" d="M320,300 h72 a20,20 0 0 1 20,20 v390 a20,20 0 0 1 -20,20 h-72 a20,20 0 0 1 -20,-20 v-390 a20,20 0 0 1 20,-20 z"/>
      <!-- Forest spine -->
      <path fill="#36AB7D" d="M450,330 h72 a20,20 0 0 1 20,20 v360 a20,20 0 0 1 -20,20 h-72 a20,20 0 0 1 -20,-20 v-360 a20,20 0 0 1 20,-20 z"/>
      <!-- Ocean spine, leaning -->
      <g transform="rotate(14 640 540)">
        <path fill="#54A0D6" d="M604,300 h72 a20,20 0 0 1 20,20 v390 a20,20 0 0 1 -20,20 h-72 a20,20 0 0 1 -20,-20 v-390 a20,20 0 0 1 20,-20 z"/>
      </g>
      <!-- spine detail lines -->
      <g stroke="#0E1D2B" stroke-width="7" stroke-linecap="round" opacity="0.55">
        <line x1="324" y1="350" x2="388" y2="350"/>
        <line x1="454" y1="380" x2="518" y2="380"/>
      </g>
      <!-- shelf bar -->
      <path fill="#ffffff" fill-opacity="0.22" d="M283,726 h444 a13,13 0 0 1 13,13 a13,13 0 0 1 -13,13 h-444 a13,13 0 0 1 -13,-13 a13,13 0 0 1 13,-13 z"/>
    </g>
  </g>

  <!-- wordmark -->
  <g transform="translate(350,0)">
    <text x="0" y="175" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="700" fill="#fdf6e9">Pagewise</text>
    <text x="4" y="225" font-family="Verdana, Geneva, sans-serif" font-size="30" fill="#e9b872" letter-spacing="2">Your reading, page by page</text>
    <!-- chips -->
    <g font-family="Verdana, Geneva, sans-serif" font-size="20" fill="#2b2118">
      <g transform="translate(4,258)">
        <rect width="150" height="40" rx="20" fill="url(#accent)"/>
        <text x="75" y="27" text-anchor="middle">📚 Library</text>
      </g>
      <g transform="translate(168,258)">
        <rect width="150" height="40" rx="20" fill="url(#accent)"/>
        <text x="75" y="27" text-anchor="middle">⏱️ Sessions</text>
      </g>
      <g transform="translate(332,258)">
        <rect width="160" height="40" rx="20" fill="url(#accent)"/>
        <text x="80" y="27" text-anchor="middle">🎯 Goals</text>
      </g>
    </g>
  </g>
</svg>
