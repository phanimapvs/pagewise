<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Pagewise — your reading, page by page">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#3b2c1c"/>
      <stop offset="0.6" stop-color="#2a1f15"/>
      <stop offset="1" stop-color="#1e150e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.44" r="0.55">
      <stop offset="0" stop-color="#8a6a40" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8a6a40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20405c"/>
      <stop offset="1" stop-color="#0d1b29"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d08a"/>
      <stop offset="1" stop-color="#dba255"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf7ec"/>
      <stop offset="1" stop-color="#edd9b6"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- Centered lockup: icon + wordmark + tagline -->
  <g transform="translate(348,78)">
    <!-- Night Shelf app icon -->
    <g filter="url(#soft)">
      <rect width="168" height="168" rx="40" fill="url(#iconbg)"/>
      <rect width="168" height="168" rx="40" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
      <g transform="translate(-65.6,-65.6) scale(0.2559)">
        <path fill="#F0A15B" d="M320,300 h72 a20,20 0 0 1 20,20 v390 a20,20 0 0 1 -20,20 h-72 a20,20 0 0 1 -20,-20 v-390 a20,20 0 0 1 20,-20 z"/>
        <path fill="#36AB7D" d="M450,330 h72 a20,20 0 0 1 20,20 v360 a20,20 0 0 1 -20,20 h-72 a20,20 0 0 1 -20,-20 v-360 a20,20 0 0 1 20,-20 z"/>
        <g transform="rotate(14 640 540)">
          <path fill="#54A0D6" d="M604,300 h72 a20,20 0 0 1 20,20 v390 a20,20 0 0 1 -20,20 h-72 a20,20 0 0 1 -20,-20 v-390 a20,20 0 0 1 20,-20 z"/>
        </g>
        <g stroke="#0E1D2B" stroke-width="7" stroke-linecap="round" opacity="0.55">
          <line x1="324" y1="350" x2="388" y2="350"/>
          <line x1="454" y1="380" x2="518" y2="380"/>
        </g>
        <path fill="#ffffff" fill-opacity="0.22" d="M283,726 h444 a13,13 0 0 1 13,13 a13,13 0 0 1 -13,13 h-444 a13,13 0 0 1 -13,-13 a13,13 0 0 1 13,-13 z"/>
      </g>
    </g>

    <!-- wordmark + tagline -->
    <text x="208" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="90" font-weight="700" fill="url(#ink)" letter-spacing="-1">Pagewise</text>
    <text x="212" y="134" font-family="'Segoe UI', Verdana, sans-serif" font-size="27" fill="#e6b876" letter-spacing="3">Your reading, page by page</text>
  </g>

  <!-- chips, centered -->
  <g font-family="'Segoe UI', Verdana, sans-serif" font-size="21" font-weight="600" fill="#2a1f15" transform="translate(417,286)">
    <g transform="translate(0,0)">
      <rect width="138" height="44" rx="22" fill="url(#accent)"/>
      <text x="69" y="29" text-anchor="middle">📚 Library</text>
    </g>
    <g transform="translate(152,0)">
      <rect width="150" height="44" rx="22" fill="url(#accent)"/>
      <text x="75" y="29" text-anchor="middle">⏱️ Sessions</text>
    </g>
    <g transform="translate(316,0)">
      <rect width="130" height="44" rx="22" fill="url(#accent)"/>
      <text x="65" y="29" text-anchor="middle">🎯 Goals</text>
    </g>
  </g>
</svg>
